<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>nekotoahiru-lab</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #0a0d12;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 40px;
  padding: 40px 20px;
  font-family: 'SF Mono', 'Menlo', 'Monaco', 'Consolas', 'Courier New', monospace;
  color: #f0f6fc;
}

.author-link {
  color: #f0f6fc;
  text-decoration: none;
  font-weight: 700;
  font-size: 14px;
  font-family: 'Hiragino Sans', sans-serif;
  padding: 8px 16px;
  border: 1px solid #30363d;
  border-radius: 999px;
  transition: all 0.2s;
}

.author-link:hover {
  border-color: #58a6ff;
  color: #58a6ff;
}

.tool-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  max-width: 380px;
}

.tool-btn {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 12px;
  padding: 20px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  text-decoration: none;
  color: #f0f6fc;
  font-size: 16px;
  font-weight: 600;
  transition: all 0.2s ease;
  font-family: inherit;
}

.tool-btn:hover {
  border-color: #58a6ff;
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
}

.tool-btn .arrow {
  color: #7ee787;
  font-size: 18px;
}

.tool-btn.disabled {
  opacity: 0.4;
  cursor: not-allowed;
  pointer-events: none;
}

.tool-btn.disabled .arrow { color: #6e7681; }
</style>
</head>
<body>

<a class="author-link" href="https://x.com/nekotoahiru2026" target="_blank" rel="noopener">@nekotoahiru2026 ↗</a>

<div class="tool-list">
  <a class="tool-btn" href="./studio/index.html">
    <span>うちのAI studio</span>
    <span class="arrow">→</span>
  </a>
  <span class="tool-btn disabled">
    <span>coming soon</span>
    <span class="arrow">—</span>
  </span>
</div>

</body>
</html>
