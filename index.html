<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>nekotoahiru-lab</title>
<meta name="description" content="「うちのAI」シリーズの実験室。AIを使った小さなツール群。">
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #0a0d12;
  min-height: 100vh;
  font-family: 'SF Mono', 'Menlo', 'Monaco', 'Consolas', 'Courier New', monospace;
  color: #f0f6fc;
  padding: 60px 20px;
}

.container {
  max-width: 960px;
  margin: 0 auto;
}

header {
  margin-bottom: 60px;
  text-align: center;
}

h1 {
  font-size: 32px;
  margin: 0 0 10px;
  letter-spacing: 0.04em;
}

.tagline {
  color: #8b949e;
  font-size: 14px;
  margin: 0 0 18px;
  font-family: 'Hiragino Sans', sans-serif;
}

.author-link {
  display: inline-block;
  color: #f0f6fc;
  text-decoration: none;
  font-weight: 700;
  font-size: 13px;
  font-family: 'Hiragino Sans', sans-serif;
  padding: 7px 14px;
  border: 1px solid #30363d;
  border-radius: 999px;
  transition: all 0.2s;
}

.author-link:hover {
  border-color: #58a6ff;
  color: #58a6ff;
}

.section-title {
  font-size: 12px;
  color: #6e7681;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin: 0 0 16px;
  font-weight: 500;
}

.tools-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 18px;
}

.tool-card {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 12px;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  text-decoration: none;
  color: inherit;
  transition: all 0.2s ease;
  min-height: 180px;
}

.tool-card:hover {
  border-color: #58a6ff;
  transform: translateY(-2px);
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
}

.tool-name {
  font-size: 20px;
  color: #f0f6fc;
  margin: 0;
  font-weight: 700;
}

.tool-desc {
  color: #8b949e;
  font-size: 13px;
  line-height: 1.7;
  margin: 0;
  font-family: 'Hiragino Sans', sans-serif;
  flex: 1;
}

.tool-link {
  color: #7ee787;
  font-size: 13px;
  margin-top: auto;
  font-weight: 600;
}

.coming-soon {
  background: #0d1117;
  border-style: dashed;
  opacity: 0.55;
  pointer-events: none;
}

.coming-soon .tool-link { color: #6e7681; }

footer {
  margin-top: 80px;
  text-align: center;
  color: #6e7681;
  font-size: 12px;
  font-family: 'Hiragino Sans', sans-serif;
}

footer a {
  color: #6e7681;
  text-decoration: none;
}

footer a:hover { color: #58a6ff; }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>nekotoahiru-lab</h1>
    <p class="tagline">「うちのAI」シリーズの実験室</p>
    <a class="author-link" href="https://x.com/nekotoahiru2026" target="_blank" rel="noopener">@nekotoahiru2026 ↗</a>
  </header>

  <p class="section-title">Tools</p>

  <div class="tools-grid">

    <a class="tool-card" href="./studio/">
      <h2 class="tool-name">うちのAI studio</h2>
      <p class="tool-desc">「こんなAIはいやだ」動画を誰でも作れるツール。簡易DSLで会話シナリオを書くだけで、縦型ターミナル風のアニメーションが完成します。</p>
      <span class="tool-link">開く →</span>
    </a>

    <div class="tool-card coming-soon">
      <h2 class="tool-name">coming soon</h2>
      <p class="tool-desc">次のツールを準備中。</p>
      <span class="tool-link">—</span>
    </div>

  </div>

  <footer>
    by <a href="https://x.com/nekotoahiru2026" target="_blank" rel="noopener">@nekotoahiru2026</a>
  </footer>
</div>

</body>
</html>
